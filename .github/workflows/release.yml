name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check
        run: |
          cargo fmt --all -- --check
          cargo test --all-targets
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup was not found at $iscc"
          }
          & $iscc installer.iss

      - name: Package portable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/pcsx2-discord-rich-presence.exe dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath "PCSX2-DiscordRichPresence-windows-x64.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            PCSX2-DiscordRichPresence-windows-x64.zip
            Output/PCSX2-DiscordRichPresence-Setup.exe
