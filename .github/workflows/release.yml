name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main

permissions:
  contents: write

jobs:
  windows:
    if: github.ref_type == 'tag' || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, '[publish-'))
    runs-on: windows-latest
    env:
      PCSX2_DISCORD_CLIENT_ID: ${{ secrets.PCSX2_DISCORD_CLIENT_ID }}
      PCSX2_DISCORD_BIOS_ASSET_KEY: ${{ secrets.PCSX2_DISCORD_BIOS_ASSET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release metadata
        id: meta
        shell: pwsh
        env:
          RELEASE_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME
          } else {
            $match = [regex]::Match($env:RELEASE_MESSAGE, '\[publish-(v[0-9]+\.[0-9]+\.[0-9]+)\]')
            if (-not $match.Success) {
              throw "Release marker not found in commit message."
            }
            $version = $match.Groups[1].Value
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Verify public Discord configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PCSX2_DISCORD_CLIENT_ID)) {
            throw "PCSX2_DISCORD_CLIENT_ID is not configured. Set the project Discord application ID as a repository Actions secret before publishing a public release."
          }
          if ([string]::IsNullOrWhiteSpace($env:PCSX2_DISCORD_BIOS_ASSET_KEY)) {
            throw "PCSX2_DISCORD_BIOS_ASSET_KEY is not configured. Upload the PS2 BIOS artwork to the project Discord application and set its asset key as a repository Actions secret before publishing a public release."
          }

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check
        run: |
          cargo fmt --all -- --check
          cargo test --all-targets
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Build installer
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "$env:ChocolateyInstall\bin\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1

          if (-not $iscc) {
            choco install innosetup --no-progress --yes
            $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          }

          if (-not $iscc) {
            $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          }

          if (-not $iscc) {
            throw "Inno Setup could not be found or installed."
          }

          & $iscc installer.iss

      - name: Package portable build and checksums
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $version = $env:RELEASE_VERSION
          $portable = "PCSX2-DiscordRichPresence-$version-windows-x64.zip"
          $installer = "PCSX2-DiscordRichPresence-$version-Setup.exe"

          $stage = Join-Path $PWD "dist"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $stage | Out-Null

          Copy-Item target/release/pcsx2-discord-rich-presence.exe $stage/
          Copy-Item README.md $stage/
          Compress-Archive -Path "$stage\*" -DestinationPath $portable

          Copy-Item Output/PCSX2-DiscordRichPresence-Setup.exe $installer

          $lines = @(
            (Get-FileHash $portable -Algorithm SHA256).Hash.ToLower() + "  " + $portable
            (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower() + "  " + $installer
          )
          $lines | Set-Content SHA256SUMS.txt -Encoding ascii

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            PCSX2-DiscordRichPresence-${{ steps.meta.outputs.version }}-windows-x64.zip
            PCSX2-DiscordRichPresence-${{ steps.meta.outputs.version }}-Setup.exe
            SHA256SUMS.txt
