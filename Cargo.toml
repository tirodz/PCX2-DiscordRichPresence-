[package]
name = "pcsx2-discord-rich-presence"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Automatic Discord Rich Presence integration for PCSX2"
license = "MIT"
repository = "https://github.com/tirodz/PCX2-DiscordRichPresence-"

[dependencies]
anyhow = "1"
directories = "6"
discord-rich-presence = "1.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
