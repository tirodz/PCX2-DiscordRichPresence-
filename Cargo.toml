[package]
name = "pcsx2-discord-rich-presence"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Automatic Discord Rich Presence integration for PCSX2"
license = "MIT"
repository = "https://github.com/tirodz/PCX2-DiscordRichPresence-"
build = "build.rs"

[dependencies]
anyhow = "1"
directories = "6"
discord-rich-presence = "1.1"
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
